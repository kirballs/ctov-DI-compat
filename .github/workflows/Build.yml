name: Build Mod

on:
  push:
    branches: ["di-petshop-compat-1.20.1", "di-petshop-compat-3.4.14"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: 17
        cache: 'gradle'

    - name: Make gradlew executable
      run: chmod +x gradlew

    - name: Build CTOV jar with Gradle
      run: ./gradlew build --stacktrace
      env:
        GRADLE_OPTS: "-Xmx4G -Dorg.gradle.daemon=false"

    # The RS × DI petshop compat datapack is intentionally kept OUT of the CTOV
    # jar — RS integration is delivered as a separate zip datapack so the jar
    # build never depends on any RS-side NBT files being present. The script
    # below just zips rs_di_compat/ into a ready-to-install datapack.
    - name: Package rs_di_compat datapack zip
      run: bash scripts/package_rs_di_compat.sh

    - name: Upload Forge jar
      uses: actions/upload-artifact@v4
      with:
        name: ctov-di-compat-forge
        path: forge/build/libs/*forge*.jar
        if-no-files-found: warn

    - name: Upload NeoForge jar
      uses: actions/upload-artifact@v4
      with:
        name: ctov-di-compat-neoforge
        path: neoforge/build/libs/*neoforge*.jar
        if-no-files-found: warn

    - name: Upload Fabric jar
      uses: actions/upload-artifact@v4
      with:
        name: ctov-di-compat-fabric
        path: fabric/build/libs/*fabric*.jar
        if-no-files-found: warn

    - name: Upload RS × DI compat datapack zip
      uses: actions/upload-artifact@v4
      with:
        name: rs-di-compat-datapack
        path: rs_di_compat/build/*.zip
        if-no-files-found: error

    - name: Upload all jars + datapack
      uses: actions/upload-artifact@v4
      with:
        name: ctov-di-compat-all-jars
        path: |
          */build/libs/*.jar
          rs_di_compat/build/*.zip
        if-no-files-found: warn
