name: Build Mod

on:
  push:
    branches: ["di-petshop-compat-1.20.1", "di-petshop-compat-3.4.14"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: 17
        cache: 'gradle'

    - name: Make gradlew executable
      run: chmod +x gradlew

    # Only build the Forge jar — NeoForge / Fabric / Quilt are not needed
    # for this user's modpack (Forge 1.20.1 + DI). Skipping the other three
    # loaders cuts build time roughly in half.
    - name: Build Forge jar with Gradle
      run: ./gradlew :forge:build --stacktrace
      env:
        GRADLE_OPTS: "-Xmx4G -Dorg.gradle.daemon=false"

    # The RS × DI petshop compat datapack is intentionally kept OUT of the CTOV
    # jar — RS integration is delivered as a separate zip datapack so the jar
    # build never depends on any RS-side NBT files being present. The script
    # below just zips rs_di_compat/ into a ready-to-install datapack.
    - name: Package rs_di_compat datapack zip
      run: bash scripts/package_rs_di_compat.sh

    # Gradle produces multiple Forge jars: the production obfuscated jar
    # (no classifier suffix), a -dev jar (unobfuscated), a -sources jar,
    # and a -dev-shadow jar (pre-remap). We only want to upload the
    # production jar — stage it in a clean directory so the upload-artifact
    # glob doesn't pick up the others.
    - name: Stage production Forge jar
      run: |
        mkdir -p build-staging
        cp forge/build/libs/[forge]ctov-*.jar build-staging/
        # Remove the dev / sources / dev-shadow jars — only keep the bare
        # versioned production jar.
        rm -f build-staging/*-dev.jar build-staging/*-sources.jar build-staging/*-dev-shadow.jar
        echo "Staged Forge jar:"
        ls -la build-staging/

    - name: Upload Forge jar
      uses: actions/upload-artifact@v4
      with:
        name: ctov-di-compat-forge
        path: build-staging/*.jar
        if-no-files-found: error

    - name: Upload RS × DI compat datapack zip
      uses: actions/upload-artifact@v4
      with:
        name: rs-di-compat-datapack
        path: rs_di_compat/build/*.zip
        if-no-files-found: error
